name: Test of package installation & execution
'on':
  push:
    branches-ignore:
      - gh-pages
  schedule:
  - cron: 0 10 * * 1
  - cron: 0 10 1 * *
  workflow_dispatch:

jobs:
  tests:
    name: All tests, on current Python
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-tags: true

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          environments: >-
            test
            docs

      - name: Tests
        run: |
          pixi run -e test test

      - name: Doctests
        run: |
          pixi run -e docs doc-tests

  debug-tests:
    name: Memory leak tests, on current debug build Python
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-tags: true

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          environments: debug

      - run: |
          pixi run -e debug test

  all_tests_passed:
    runs-on: ubuntu-latest
    name: All tests passed
    needs: [tests, debug-tests]
    if: always()
    steps:
      - name: All tests ok
        if: ${{ !(contains(needs.*.result, 'failure')) }}
        run: exit 0
      - name: Some tests failed
        if: ${{ contains(needs.*.result, 'failure') }}
        run: exit 1
