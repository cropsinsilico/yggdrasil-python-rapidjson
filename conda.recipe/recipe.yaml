context:
  name: "yggdrasil-python-rapidjson"
  version: "1.23.0.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  path: ../

build:
  number: 0
  script:
    content:
      - if: unix
        then: |
          if [[ "${{ python }}" == *t ]]; then
            export CMAKE_ARGS="${CMAKE_ARGS} -DPython3_FIND_ABI=ANY;ANY;ANY;ON"
          fi
          export CMAKE_GENERATOR="Ninja"
          ${{ PYTHON }} -m pip install . --no-deps --ignore-installed -vv
      - if: win
        then: |
          set "PYTHON_VERSION=${{ python }}"
          IF "%PYTHON_VERSION:~-1%"=="t" (
            set "CMAKE_ARGS=%CMAKE_ARGS% -DPython3_FIND_ABI=ANY;ANY;ANY;ON"
          )
          set "SKBUILD_CMAKE_ARGS=-G Ninja"
          ${{ PYTHON }} -m pip install . --no-deps --ignore-installed -vv

requirements:
  build:
    - if: build_platform != host_platform
      then:
        - cross-python_${{ host_platform }}
        - numpy
        - python
        - if: match(python, ">=3.15")
          then: libpython
    - cmake >=3.15
    - ninja
    - ${{ stdlib('c') }}
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - yggdrasil-rapidjson >=1.1.0.5
  host:
    - hatch-fancy-pypi-readme
    - numpy
    - pip
    - python
    - if: match(python, ">=3.15")
      then: libpython
    - scikit-build-core
    - setuptools_scm
  run:
    - ${{ stdlib('c') }}
    - python
    - if: match(python, ">=3.15")
      then: libpython
    - numpy

tests:
  - python:
      imports:
        - yggdrasil_rapidjson
  - script:
      - pytest -sv tests
    requirements:
      run:
        - pandas
        - pytest
        - pytz
        - trimesh
        - unyt
    files:
      source:
        - tests/

about:
  homepage: https://github.com/cropsinsilico/yggdrasil-python-rapidjson
  repository: https://github.com/cropsinsilico/yggdrasil-python-rapidjson
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: A Python wrapper around YggdrasilRapidJSON.
  description: |
    A Python wrapper around YggdrasilRapidJSON. YggdrasilRapidJSON is a
    header-only C++ library for JSON operation extended for use with
    yggdrasil
  documentation: https://cropsinsilico.github.io/yggdrasil-python-rapidjson

extra:
  recipe-maintainers:
    - langmm
